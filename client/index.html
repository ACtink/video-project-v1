<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HelloStranger</title>

  <link rel="icon" type="image/png" href="public/video-call-logo.png" />

  <style>
   body {
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
  color: white;

  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;

  /* 💎 Elegant sexy gradient */
  background: linear-gradient(
    135deg,
    #0b0f1a,
    #1a0f2e,
    #2a0f3f,
    #0b1a2e
  );
  background-size: 300% 300%;
  animation: elegantFlow 18s ease infinite;
}

@keyframes elegantFlow {
  0%   { background-position: 0% 50%; }
  50%  { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}


    h1 {
      margin-top: 20px;
      font-size: 2.3rem;
      color: #00c8ff;
      text-shadow: 0 0 20px #00c8ff;
      text-align: center;
      padding: 0 12px;
    }

    #status {
      margin-top: 10px;
      font-size: 1rem;
      color: #bbb;
      text-align: center;
    }

    #loading {
      margin-top: 15px;
      font-size: 1.2rem;
      display: none;
      color: #00c8ff;
      text-shadow: 0 0 10px #00c8ff;
      animation: pulse 1.5s infinite ease-in-out;
      text-align: center;
    }

    @keyframes pulse {
      0% { opacity: 0.3; }
      50% { opacity: 1; }
      100% { opacity: 0.3; }
    }

    .video-container {
      margin-top: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
      /* width: 100%; */
    }

    /* VIDEO WRAPPER */
    .video-wrapper {
      position: relative;
      width: 92vw;
      max-width: 720px;
      aspect-ratio: 16 / 9;
    }

    video {
      width: 100%;
      height: 100%;
      background: #000;
      border-radius: 15px;
      border: 3px solid #00c8ff;
      box-shadow: 0 0 20px rgba(0, 200, 255, 0.5);
      object-fit: contain;
    }

    /* ROTATING LOADER */
    .video-loader {
      position: absolute;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      border-radius: 15px;
      z-index: 5;
      box-sizing: border-box;
      padding: 3px;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid rgba(0, 200, 255, 0.2);
      border-top: 6px solid #00c8ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .controls {
      margin-top: 30px;
      display: flex;
      gap: 20px;
      justify-content: center;
      flex-wrap: wrap;
      padding-bottom: 20px;
    }

    .controls button {
      padding: 14px 24px;
      font-size: 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.15s ease, background 0.2s ease;
      min-width: 120px;
    }

    .controls button:active {
      transform: scale(0.95);
    }

    #startBtn {
      background: #00c8ff;
      color: #000;
    }

    .next {
      background: #ffaa00;
      color: #000;
    }

    .end {
      background: #ff4444;
      color: white;
    }

    /* DESKTOP */
    @media (min-width: 1200px) {
      .video-container {
        flex-direction: row;
        gap: 40px;
      }

      .video-wrapper {
        width: calc((100vw - 160px) / 2);
        max-width: 1200px;
        height: 60vh;
        aspect-ratio: auto;
      }

      h1 {
        font-size: 2.6rem;
      }
    }
  </style>
</head>

<body>

<h1>HelloStranger — Talk to Real People Across the Globe</h1>

<div id="status">
  Status: <span id="connectionState">Disconnected</span>
</div>

<div id="loading">Finding a stranger…</div>

<div class="video-container">
  <div class="video-wrapper">
    <video id="localVideo" autoplay muted playsinline></video>
  </div>

  <div class="video-wrapper">
    <div class="video-loader" id="remoteLoader">
      <div class="spinner"></div>
    </div>
    <video id="remoteVideo" autoplay playsinline></video>
  </div>
</div>

<div class="controls">
  <button id="startBtn">Start</button>
  <button id="nextBtn" class="next">Next</button>
  <button id="endBtn" class="end">Close</button>
  <button id="exitBtn" class="end">Exit</button>

</div>

<script src="client.js"></script>



</body>
</html>
